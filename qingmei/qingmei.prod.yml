# 青梅 · 生产组合（接真实模型）
#
# 与 qingmei.yml 的差别只有模型提供方：本文件用 OpenAI 兼容端点，
# 密钥从环境变量读（systemd EnvironmentFile 或 shell export），不进仓库。
#
# 用法：
#   QM_LLM_KEY=sk-... QM_TOKEN=... node apps/server/src/index.ts --config qingmei.prod.yml

- name: '@qingmei/service-store'
- name: '@qingmei/service-llm'
- name: '@qingmei/service-channel'
- name: '@qingmei/service-gateway'

- name: '@qingmei/provider-store-sqlite'
  config:
    path: './data/qm.db'

- name: '@qingmei/service-memory'

- name: '@qingmei/provider-memory-sqlite'
  config:
    limit: 8
    minConfidence: 0.6

# 工具调用的准入与留痕：host-mcp 每次 tools/call 都过这里
- name: '@qingmei/provider-permission-static'

- name: '@qingmei/provider-audit-sqlite'

# 待人确认的审批队列：permission 判 ask、或子 agent 请求权限时落一条
- name: '@qingmei/provider-approval-sqlite'

# 任务账本：qm-task 派发、子 agent 经 MCP 上报进度
- name: '@qingmei/provider-task-sqlite'
  config:
    workspaceRoot: './data/workspaces'

- name: '@qingmei/provider-llm-openai'
  config:
    baseURL: { $env: 'QM_LLM_BASE_URL' }
    apiKey: { $env: 'QM_LLM_KEY' }
    model: 'deepseek-v4-flash'
    maxTokens: 800

# 对话车道：内嵌 DSH。密钥通过 env 传给子进程，不写进配置。
- name: '@qingmei/provider-dsh-acp'
  config:
    command: '/usr/local/bin/dsh'
    args: ['--profile', 'acp']
    cwd: './workspace'
    env:
      QM_DSH_API_KEY: { $env: 'QM_DSH_API_KEY' }

- name: '@qingmei/qm-agent'
  config:
    persona: '你叫青梅，是一个务实的个人助理。回答简短、直接，不寒暄。'

# qm_message 的唯一写入方：对话、提醒、以后所有主动消息都经它落库
- name: '@qingmei/qm-history'

# 把任务派给 harness（POST /api/v1/tasks），进度经 MCP 回到账本
- name: '@qingmei/qm-task'
  config:
    workspaceRoot: './data/workspaces'
    timeoutMs: 600000
    # 同时最多 2 个 harness run，其余排队；重启时排队任务会重新排队
    maxConcurrent: 2

# 审批队列的 HTTP 面：GET /api/v1/approvals、POST /api/v1/approvals/decide
- name: '@qingmei/qm-approval'

# 审计的只读查询面：GET /api/v1/audit
- name: '@qingmei/qm-audit'

# 自主循环（A1 建议模式）：每 5 分钟巡一次，值得打扰时给一条建议
- name: '@qingmei/qm-autonomy'
  config:
    dailyBudget: 3
    quietStart: 23
    quietEnd: 8

# 回合结束后异步抽取事实；走 llm 车道，不阻塞回复
- name: '@qingmei/provider-schedule-sqlite'
  config:
    tickMs: 1000
    # cron 没带时区时按东八区算，服务器时区是 UTC 也不会偏 8 小时
    defaultTimezone: 'Asia/Shanghai'

- name: '@qingmei/qm-reminder'

- name: '@qingmei/host-mcp'
  config:
    host: '127.0.0.1'
    port: 7420
    token: { $env: 'QM_MCP_TOKEN' }

- name: '@qingmei/qm-memory-extract'
  config:
    minConfidence: 0.7
    maxFacts: 5

- name: '@qingmei/channel-web'

- name: '@qingmei/host-gateway'
  config:
    host: '127.0.0.1'
    port: 7410
    token: { $env: 'QM_TOKEN' }
    webRoot: './apps/web/public'


