# 青梅 · 生产组合
#
# 与 qingmei.yml 的差别只有三处：
#   1. 不装 provider-llm-echo：生产对话与任务都走 DSH（ACP）；
#   2. 密钥一律从环境变量读（systemd EnvironmentFile /etc/qingmei/env），不进仓库；
#   3. 静态资源与技能目录按 /opt/qingmei 的部署布局写死。
#
# 这份清单与线上 /opt/qingmei/qingmei.yml 的装配保持一致（20 项）；
# 改完先跑 `node scripts/check-config.mjs --env`，名字写错或少了环境变量会在部署前报出来。
#
# 月度复盘原在 experimental，2026-11-12 提升进默认装配（报告 + 评分 + 提案）。
# 内容层（qm-content）已删除：没有平台连接器时发布永远是 409，留着只是死代码。

# ── 运行时服务（契约在 core）
- name: '@qingmei/service-channel'
- name: '@qingmei/service-gateway'

# 技能包：/opt/qingmei/skills 是部署时可写的目录，不跟随 release 回滚
- name: '@qingmei/qm-skill'
  config:
    skillsDir: /opt/qingmei/skills

# ── 提供方
- name: '@qingmei/provider-store-sqlite'
  config:
    path: './data/qm.db'

- name: '@qingmei/provider-neuron-memory'
  config:
    limit: 8
    minConfidence: 0.6
    # 概念合并/分裂默认只提案；生产显式开启「每次沉淀最多自动应用一条」
    autoApplyConcepts: true

# 对话与任务的唯一执行器：DSH 以 ACP 子进程方式拉起，密钥经 env 传进去
- name: '@qingmei/provider-dsh-acp'
  config:
    command: '/usr/local/bin/dsh'
    args: ['--profile', 'acp']
    cwd: './workspace'
    env:
      QM_DSH_API_KEY: { $env: 'QM_DSH_API_KEY' }

# 日程账本：at / everyMs / cron；到点由 provider 直接投递
- name: '@qingmei/provider-schedule-sqlite'
  config:
    tickMs: 1000
    defaultTimezone: 'Asia/Shanghai'

# ── 业务
- name: '@qingmei/service-persona'
  config:
    path: personas/qingmei.json

- name: '@qingmei/qm-agent'
  config:
    persona: '你叫青梅，是一个务实的个人助理。回答简短、直接，不寒暄。'

# qm_message 的唯一写入方
- name: '@qingmei/qm-history'

# 自主循环：A1 建议模式，5 分钟巡一次；子模块（督促/开场/休息/故障/群画像）默认关闭
- name: '@qingmei/qm-autonomy'
  config:
    tickMs: 300000
    # 不限量（0）：随时可以找主人；静默时段与单规则冷却仍在
    dailyBudget: 0
    quietStart: 23
    quietEnd: 8
    # 装上主动模块：开场、督促、休息、故障提案、群策略
    modules: true
    # 每日一次自省：失败任务 → 补救建议；A2 才会真的建任务
    reflection: true
    reflectionHour: 9

# 自我进化：成功任务 → 技能草稿，人审后 install（技能自带版本备份与回滚）
- name: '@qingmei/qm-evolve'
  config:
    maxDrafts: 20
# 可选语义向量：智谱 embedding-3（OpenAI 兼容）；没配 QM_EMBEDDING_URL 时自动不注册
- name: '@qingmei/provider-embedding-http'
  config:
    url: { $env: QM_EMBEDDING_URL }
    apiKey: { $env: QM_EMBEDDING_KEY }
    model: embedding-3
# 成本观测：读 DeepSeek 余额（只读），记录每日快照；没有 key 时静默
- name: '@qingmei/qm-cost'
  config: {}
# 任务账本与调度：同一时间最多 2 个 harness run，其余排队；重启后恢复
- name: '@qingmei/qm-task'
  config:
    workspaceRoot: './data/workspaces'
    timeoutMs: 600000
    maxConcurrent: 2
    # 设备任务 60 分钟没有任何进展就收为 failed（设备崩溃不会让 run 永远 running）
    leaseTimeoutMs: 3600000
    quietHours:
      start: '23:00'
      end: '08:00'

# 设备注册、claim/progress/finish、记忆回灌
- name: '@qingmei/qm-device'
  config: {}

# 审批队列的 HTTP 面与渠道推送（飞书卡片 / QQ 键盘）
- name: '@qingmei/qm-approval'

# 自规划循环：任务结束后读目标账本+最近任务，让模型决定下一步（建任务/提醒/申请研究/跳过）
# 默认只允许一层自建任务、每天最多 3 个；研究申请走审批
- name: '@qingmei/qm-planner'
  config:
    enabled: true
    maxSelfTasksPerDay: 3
    maxDepth: 1
    cooldownMinutes: 30
    notifyChannel: web
    notifyConversation: owner

# 审计只读查询面：GET /api/v1/audit
- name: '@qingmei/qm-audit'

# 身份绑定：每渠道第一个私聊自动绑 owner
- name: '@qingmei/qm-identity'

# 会话凝练：回合结束后按规则抽「候选事实」，主人在记忆页采纳才写入
- name: '@qingmei/qm-distill'
  config:
    maxPending: 200
    # 生产没有 LLM provider，模型补抽只能是关闭状态
    llmExtract: false

# 月度复盘：每月 1 号出报告，可在「复盘」页评分、采纳 prompt 提案
- name: '@qingmei/qm-review'
  config:
    dayOfMonth: 1
    hour: 9
# ── 渠道与宿主
- name: '@qingmei/channel-web'

# 飞书：配置 appId/appSecret（或 QM_FEISHU_APP_ID / QM_FEISHU_APP_SECRET）才启用
- name: '@qingmei/channel-feishu'

# QQ 机器人：配置 appId/clientSecret（或 QM_QQ_APP_ID / QM_QQ_CLIENT_SECRET）才启用
- name: '@qingmei/channel-qq'

- name: '@qingmei/host-gateway'
  config:
    host: '127.0.0.1'
    port: 7410
    token: { $env: 'QM_TOKEN' }
    adminUser: 'admin'
    adminPassword: { $env: 'QM_ADMIN_PASSWORD' }
    # 外壳模式（current -> releases/<id>）：跟随 release，回滚时前后端一起回退
    webRoot: '/opt/qingmei/current/apps/web/dist'









