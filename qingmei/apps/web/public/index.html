<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e1014" />
    <title>青梅 · P1</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230e1014'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%237ed6a6'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- P1 零构建：原生 ES module 直接由网关托管；M0 起迁移 Vue 3（见 app.js 顶部注释）。 -->
    <div class="app">
      <header class="topbar">
        <h1 class="brand">青梅 · <span class="brand-phase">P1</span></h1>
        <div class="topbar-actions">
          <button
            id="tasks-toggle"
            class="ghost"
            type="button"
            aria-expanded="false"
            aria-controls="tasks"
            title="查看任务"
          >
            任务
          </button>
          <button
            id="schedules-toggle"
            class="ghost"
            type="button"
            aria-expanded="false"
            aria-controls="schedules"
            title="查看日程"
          >
            日程
          </button>
          <span
            id="status"
            class="status"
            data-state="connecting"
            role="status"
            aria-live="polite"
            title="连接中…"
          >
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text" class="status-text">连接中…</span>
          </span>
        </div>
      </header>

      <section id="tasks" class="tasks" hidden aria-labelledby="tasks-title">
        <div class="tasks-head">
          <h2 id="tasks-title" class="tasks-title">任务</h2>
          <div class="tasks-tools">
            <button id="tasks-refresh" class="ghost" type="button">刷新</button>
            <button id="tasks-close" class="ghost" type="button">关闭</button>
          </div>
        </div>
        <p id="tasks-empty" class="tasks-empty">
          还没有任务。在对话里说「用 DSH 把测试跑一遍」，或者直接 POST /api/v1/tasks。
        </p>
        <p id="tasks-error" class="tasks-error" role="alert" hidden></p>
        <ul id="tasks-list" class="tasks-list"></ul>
      </section>

      <section id="schedules" class="schedules" hidden aria-labelledby="schedules-title">
        <div class="schedules-head">
          <h2 id="schedules-title" class="schedules-title">日程</h2>
          <div class="schedules-tools">
            <button id="schedules-refresh" class="ghost" type="button">刷新</button>
            <button id="schedules-close" class="ghost" type="button">关闭</button>
          </div>
        </div>
        <p id="schedules-empty" class="schedules-empty">
          还没有日程。在对话里说一句「每天九点提醒我喝水」就行。
        </p>
        <p id="schedules-error" class="schedules-error" role="alert" hidden></p>
        <ul id="schedules-list" class="schedules-list"></ul>
      </section>

      <main id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="对话">
        <p id="empty" class="empty">说点什么吧。P1 先跑通一条最小闭环。</p>
      </main>

      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="input">消息</label>
        <textarea
          id="input"
          class="input"
          name="text"
          rows="1"
          maxlength="8000"
          placeholder="给青梅发消息…"
          enterkeyhint="send"
        ></textarea>
        <button id="send" class="send" type="submit">发送</button>
      </form>
    </div>
    <noscript><p class="noscript">青梅 Web 端需要 JavaScript。</p></noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
