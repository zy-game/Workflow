<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>青梅 · 连接</title>
    <style>
      :root {
        --paper: #f7f5ef;
        --ink: #22302b;
        --muted: #6f7d76;
        --green: #3f7f63;
        --line: #dfe5df;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 0%, #e9f4ed, var(--paper) 55%);
        color: var(--ink);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: min(360px, calc(100vw - 32px));
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 26px 22px 22px;
        box-shadow: 0 18px 50px rgb(35 60 48 / 12%);
      }
      .orb {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        margin: 0 auto 10px;
        display: grid;
        place-items: center;
        font-size: 26px;
        background: #e8f5ee;
      }
      h1 { font-size: 21px; text-align: center; margin: 0 0 4px; }
      p { color: var(--muted); text-align: center; margin: 0 0 18px; }
      label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 13px;
        font: inherit;
        color: var(--ink);
        background: #fbfcfa;
        outline: none;
      }
      input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgb(63 127 99 / 12%); }
      button {
        width: 100%;
        margin-top: 20px;
        border: 0;
        border-radius: 12px;
        padding: 13px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--green);
      }
      button:disabled { opacity: .6; }
      .error { margin-top: 12px; color: #b34a3a; font-size: 13px; text-align: center; min-height: 18px; }
      .reset { display: block; margin: 14px auto 0; border: 0; background: none; color: var(--muted); font-size: 12px; width: auto; }
      .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }`n      .server-note { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="orb">🐳</div>
      <h1>连接青梅</h1>
      <p>手机和服务器在同一个网关下</p>

      <form id="form">
        <div class="server-note">服务器：139.155.78.241:8710</div>
        <label for="user">管理员账号</label>
        <input id="user" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="admin" required />
        <label for="token">密码（或 QM_TOKEN）</label>
        <input id="token" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="密码" required />
        <button id="submit" type="submit">连接</button>
        <div class="error" id="error"></div>
      </form>

      <button class="reset" id="reset" type="button">清除已保存的连接</button>
      <div class="hint">令牌用 Android Keystore 加密保存在本机，不上传。</div>
    </main>

    <script>
      const SERVER_KEY = 'qm.server'
      const TOKEN_KEY = 'qm.token'
      const reset = new URLSearchParams(location.search).has('reset')
      const errorEl = document.getElementById('error')
      const form = document.getElementById('form')
      const submit = document.getElementById('submit')
      const server = 'https://139.155.78.241:8710'
      const secure = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SecureStore

      async function readToken() {
        if (secure) {
          try {
            const result = await secure.get({ key: TOKEN_KEY })
            if (result && result.value) return result.value
          } catch {
            // 系统密钥库不可用时回退到会话存储
          }
        }
        return sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY) || ''
      }

      async function saveToken(token) {
        if (secure) {
          try {
            await secure.set({ key: TOKEN_KEY, value: token })
            localStorage.removeItem(TOKEN_KEY)
          } catch {
            localStorage.setItem(TOKEN_KEY, token)
          }
        } else {
          localStorage.setItem(TOKEN_KEY, token)
        }
        sessionStorage.setItem(TOKEN_KEY, token)
      }

      async function removeToken() {
        if (secure) {
          try {
            await secure.remove({ key: TOKEN_KEY })
          } catch {
            // 忽略
          }
        }
        localStorage.removeItem(TOKEN_KEY)
        sessionStorage.removeItem(TOKEN_KEY)
      }

      async function boot() {
        if (!reset) {
          const token = await readToken()
          if (token) {
            sessionStorage.setItem(TOKEN_KEY, token)
            location.replace('./app/index.html')
            return
          }
        }
      }

      document.getElementById('reset').addEventListener('click', () => {
        localStorage.removeItem(SERVER_KEY)
        void removeToken()
        errorEl.textContent = ''
      })

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        errorEl.textContent = ''
        submit.disabled = true
        try {
          const user = document.getElementById('user').value.trim() || 'admin'
          const password = document.getElementById('token').value
          if (!password) throw new Error('密码不能为空')
          const res = await fetch(server + '/api/v1/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-QM-Client': 'mobile' },
            body: JSON.stringify({ user, password }),
          })
          if (res.status === 401) throw new Error('账号或密码不对')
          if (!res.ok) throw new Error('服务器返回 ' + res.status)
          const login = await res.json().catch(() => ({}))
          const token = typeof login.token === 'string' ? login.token : ''
          if (!token) throw new Error('登录响应缺少 token')
          await saveToken(token)
          const notifications = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications
          if (notifications) void notifications.requestPermissions().catch(() => undefined)
          location.replace('./app/index.html')
        } catch (error) {
          errorEl.textContent = error && error.message ? error.message : '连接失败'
        } finally {
          submit.disabled = false
        }
      })

      void boot()
    </script>
  </body>
</html>
