<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9f4ed" />
    <title>青梅</title>
    <style>
      :root {
        --paper: #edf6ef;
        --ink: #22302b;
        --muted: #6f7d76;
        --green: #3f7f63;
        --card: rgb(255 255 255 / 82%);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 50% 18%, rgb(255 255 255 / 85%), transparent 42%),
          linear-gradient(165deg, #edf6ef, #dceee4 55%, #cfe5d9);
      }
      .sky {
        position: fixed;
        inset: 0;
        background-image: radial-gradient(rgb(63 127 99 / 10%) 1px, transparent 1px);
        background-size: 18px 18px;
        opacity: .45;
        pointer-events: none;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: max(14px, env(safe-area-inset-top)) 20px 0;
        z-index: 4;
      }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .04em; }
      .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #b7c2ba; }
      .brand .dot.online { background: #3fb950; box-shadow: 0 0 0 4px rgb(63 185 80 / 14%); }
      .status { font-size: 12px; color: var(--muted); }
      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 8vh 20px 120px;
      }
      .pet-wrap { position: relative; display: grid; place-items: center; width: min(78vw, 360px); }
      .glow {
        position: absolute;
        width: 70%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(255 255 255 / 78%), transparent 68%);
        filter: blur(10px);
      }
      video {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: contain;
        background: transparent;
        filter: drop-shadow(0 22px 24px rgb(24 44 34 / 20%));
      }
      .bubble {
        position: fixed;
        left: 50%;
        bottom: calc(50% + 260px);
        transform: translateX(-50%);
        width: min(86vw, 380px);
        padding: 12px 16px;
        border-radius: 18px 18px 18px 6px;
        background: var(--card);
        border: 1px solid rgb(255 255 255 / 80%);
        box-shadow: 0 12px 34px rgb(32 60 46 / 14%);
        backdrop-filter: blur(12px);
        font-size: 14px;
        max-height: 24vh;
        overflow: auto;
        white-space: pre-wrap;
        z-index: 3;
      }
      .bubble[hidden] { display: none; }
      .hint {
        position: fixed;
        left: 50%;
        bottom: calc(30vh + 48px);
        transform: translateX(-50%);
        color: var(--muted);
        font-size: 12px;
        z-index: 2;
        white-space: nowrap;
      }
      .dock {
        position: fixed;
        left: 50%;
        bottom: max(22px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 8px;
        width: min(92vw, 420px);
        justify-content: center;
        border-radius: 999px;
        background: rgb(255 255 255 / 72%);
        border: 1px solid rgb(255 255 255 / 80%);
        box-shadow: 0 10px 28px rgb(32 60 46 / 12%);
        backdrop-filter: blur(14px);
        z-index: 5;
      }
      .dock button {
        border: 0;
        border-radius: 999px;
        padding: 10px 12px;
        font: inherit;
        font-weight: 600;
        white-space: nowrap;
        flex: 1 1 0;
        min-width: 0;
        font-size: 14px;
        color: var(--ink);
        background: transparent;
      }
      .dock button.primary {
        color: #fff;
        background: var(--green);
      }
      .dock button:active { transform: scale(.97); }
      .sheet {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        align-items: end;
        background: rgb(18 32 25 / 28%);
        backdrop-filter: blur(3px);
      }
      .sheet[hidden] { display: none; }
      .sheet-card {
        background: #fff;
        border-radius: 24px 24px 0 0;
        padding: 14px 16px max(18px, env(safe-area-inset-bottom));
        box-shadow: 0 -18px 50px rgb(20 40 30 / 18%);
        max-height: 76vh;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sheet-head { display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
      .sheet-head button { border: 0; background: transparent; font-size: 22px; color: var(--muted); }
      .menu-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .menu-list button {
        border: 1px solid #e4ebe6;
        background: #f8fbf9;
        border-radius: 14px;
        padding: 14px 12px;
        font: inherit;
        color: var(--ink);
        text-align: left;
      }
      .chat-messages { overflow: auto; display: flex; flex-direction: column; gap: 8px; min-height: 120px; max-height: 48vh; padding: 4px 0; }
      .chat-msg { max-width: 82%; padding: 9px 12px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
      .chat-msg.user { align-self: flex-end; background: var(--green); color: #fff; border-bottom-right-radius: 4px; }
      .chat-msg.assistant { align-self: flex-start; background: #f0f5f1; color: var(--ink); border-bottom-left-radius: 4px; }
      .chat-form { display: flex; gap: 8px; }
      .chat-form input { flex: 1; border: 1px solid #dfe7e2; border-radius: 12px; padding: 11px 12px; font: inherit; background: #fbfdfb; }
      .chat-form button { border: 0; border-radius: 12px; padding: 0 16px; background: var(--green); color: #fff; font: inherit; font-weight: 600; }    </style>
  </head>
  <body>
    <div class="sky"></div>
    <header>
      <div class="brand"><span class="dot" id="dot"></span>青梅</div>
      <div class="status" id="status">连接中…</div>
    </header>

    <main class="stage">
      <div class="pet-wrap" id="pet-wrap">
        <div class="glow"></div>
        <video id="pet" autoplay loop muted playsinline preload="auto" src="./pet/idle-breath.webm"></video>
      </div>
    </main>

    <div class="bubble" id="bubble" hidden></div>
    <div class="hint" id="hint">点点我</div>

    <nav class="dock">
      <button id="chat" class="primary">聊聊天</button>
      <button id="quiet">安静一会</button>
      <button id="overlay" hidden>悬浮桌宠</button>
    </nav>

    <div id="menu" class="sheet" hidden>
      <div class="sheet-card">
        <div class="sheet-head"><span>想做什么</span><button type="button" data-close="menu">×</button></div>
        <div class="menu-list">
          <button type="button" data-action="pet">摸摸头</button>
          <button type="button" data-action="chat">聊聊天</button>
          <button type="button" data-action="overlay">悬浮桌宠</button>
          <button type="button" data-action="quiet">安静一会</button>
          <button type="button" data-action="app">完整面板</button>
          <button type="button" data-action="exit">关闭青梅</button>
        </div>
      </div>
    </div>

    <div id="chat-sheet" class="sheet" hidden>
      <div class="sheet-card">
        <div class="sheet-head"><span>和青梅说句话</span><button type="button" data-close="chat-sheet">×</button></div>
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" autocomplete="off" placeholder="说点什么…" />
          <button type="submit">发送</button>
        </form>
      </div>
    </div>
    <script src="./config.js"></script>
    <script>
      const base = String(window.__QM_SERVER_URL || '').replace(/\/+$/, '')
      const token = sessionStorage.getItem('qm.token') || localStorage.getItem('qm.token') || ''
      if (!base || !token) location.replace('./index.html')

      const el = {
        dot: document.getElementById('dot'),
        status: document.getElementById('status'),
        bubble: document.getElementById('bubble'),
        hint: document.getElementById('hint'),
        pet: document.getElementById('pet'),
        wrap: document.getElementById('pet-wrap'),
        chat: document.getElementById('chat'),
        quiet: document.getElementById('quiet'),
      }
      const LINES = ['在呢。', '摸摸头～', '今天也慢慢来。', '我在这儿陪你。', '要不要聊两句？']
      const IDLE = './pet/idle-breath.webm'
      const CLICK = ['./pet/click-wave.webm', './pet/click-happy.webm', './pet/click-tickle.webm']
      let bubbleTimer = null
      let current = IDLE
      let quiet = localStorage.getItem('qm.pet.quiet') === '1'

      function setOnline(online) {
        el.dot.classList.toggle('online', online)
        el.status.textContent = online ? '在线' : '离线'
      }

      function showBubble(text) {
        if (!text) return
        el.bubble.textContent = text
        el.bubble.hidden = false
        clearTimeout(bubbleTimer)
        // 保留最新一条，直到新消息或手动安静
      }

      function play(src) {
        if (current === src) {
          el.pet.currentTime = 0
          void el.pet.play()
          return
        }
        current = src
        el.pet.src = src
        void el.pet.play().catch(() => undefined)
      }

      function notify(text) {
        const plugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications
        if (!plugin || !document.hidden || quiet) return
        void plugin
          .schedule({
            notifications: [
              { id: Math.floor(Date.now() % 2147483647), title: '青梅', body: String(text).slice(0, 120) },
            ],
          })
          .catch(() => undefined)
      }

      function textOfBlocks(blocks) {
        if (!Array.isArray(blocks)) return ''
        return blocks
          .filter((block) => block && block.type === 'text' && typeof block.text === 'string')
          .map((block) => block.text)
          .join('\n')
          .trim()
      }

      async function latest() {
        try {
          const res = await fetch(base + '/api/v1/messages?conversationId=owner&limit=1', {
            headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
          })
          if (!res.ok) {
            setOnline(false)
            return
          }
          setOnline(true)
          const rows = await res.json()
          const text = Array.isArray(rows) && rows[0] ? String(rows[0].text || '') : ''
          if (text) showBubble(text.slice(0, 500))
        } catch {
          setOnline(false)
        }
      }

      function connect() {
        const source = new EventSource(base + '/api/v1/events?token=' + encodeURIComponent(token))
        source.addEventListener('open', () => setOnline(true))
        source.addEventListener('assistant', (event) => {
          try {
            const payload = JSON.parse(event.data)
            const text = textOfBlocks(payload.blocks) || String(payload.text || '')
            if (!text) return
            showBubble(text.slice(0, 500))
            notify(text)
            if (!chatSheet.hidden) appendChat('assistant', text)
          } catch {}
        })
        source.addEventListener('error', () => setOnline(false))
      }

      el.pet.addEventListener('ended', () => play(IDLE))
      el.wrap.addEventListener('click', () => {
        play(CLICK[Math.floor(Math.random() * CLICK.length)])
        if (!quiet) showBubble(LINES[Math.floor(Math.random() * LINES.length)])
      })

      el.chat.addEventListener('click', () => {
        openChat()
      })

      const overlay = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PetOverlay
      const overlayButton = document.getElementById('overlay')
      if (overlay && overlayButton) {
        overlayButton.hidden = false
        void overlay.isRunning().then((result) => {
          if (result && result.running) overlayButton.textContent = '停止悬浮'
        })
        overlayButton.addEventListener('click', async () => {
          try {
            const running = await overlay.isRunning()
            if (running && running.running) {
              await overlay.stop()
              overlayButton.textContent = '悬浮桌宠'
              showBubble('已停止悬浮')
              return
            }
            const check = await overlay.canDraw()
            if (!check || !check.granted) {
              await overlay.openSettings()
              showBubble('打开「显示在其他应用上层」后再点悬浮')
              return
            }
            await overlay.start()
            overlayButton.textContent = '停止悬浮'
            showBubble('已开启悬浮，回桌面看看')
          } catch (error) {
            showBubble(error && error.message ? error.message : '悬浮启动失败')
          }
        })
      }

      el.quiet.addEventListener('click', () => {
        quiet = !quiet
        localStorage.setItem('qm.pet.quiet', quiet ? '1' : '0')
        el.quiet.textContent = quiet ? '取消安静' : '安静一会'
        el.hint.textContent = quiet ? '已安静，不会再弹气泡' : '点点我'
      })
      if (quiet) {
        el.quiet.textContent = '取消安静'
        el.hint.textContent = '已安静，不会再弹气泡'
      }

      const menuSheet = document.getElementById('menu')
      const chatSheet = document.getElementById('chat-sheet')
      const chatMessages = document.getElementById('chat-messages')
      const chatForm = document.getElementById('chat-form')
      const chatInput = document.getElementById('chat-input')
      let longPressed = false
      let pressTimer = null

      function openSheet(sheet) {
        closeSheets()
        sheet.hidden = false
      }

      function closeSheets() {
        menuSheet.hidden = true
        chatSheet.hidden = true
      }

      function appendChat(role, text) {
        if (!text) return
        const node = document.createElement('div')
        node.className = 'chat-msg ' + (role === 'user' ? 'user' : 'assistant')
        node.textContent = text
        chatMessages.append(node)
        chatMessages.scrollTop = chatMessages.scrollHeight
      }

      async function loadChat() {
        chatMessages.replaceChildren()
        try {
          const res = await fetch(base + '/api/v1/messages?conversationId=owner&limit=30', {
            headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
          })
          if (!res.ok) return
          const rows = await res.json()
          for (const row of Array.isArray(rows) ? rows : []) {
            appendChat(row.role === 'user' ? 'user' : 'assistant', String(row.text || ''))
          }
        } catch {}
      }

      function openChat() {
        openSheet(chatSheet)
        void loadChat()
        setTimeout(() => chatInput.focus(), 300)
      }

      document.querySelectorAll('[data-close]').forEach((button) => {
        button.addEventListener('click', () => {
          const sheet = document.getElementById(button.dataset.close)
          if (sheet) sheet.hidden = true
        })
      })
      ;[menuSheet, chatSheet].forEach((sheet) => {
        sheet.addEventListener('click', (event) => {
          if (event.target === sheet) sheet.hidden = true
        })
      })

      document.querySelectorAll('[data-action]').forEach((button) => {
        button.addEventListener('click', () => {
          const action = button.dataset.action
          closeSheets()
          if (action === 'pet') {
            play(CLICK[Math.floor(Math.random() * CLICK.length)])
            showBubble(LINES[Math.floor(Math.random() * LINES.length)])
          } else if (action === 'chat') {
            openChat()
          } else if (action === 'overlay') {
            document.getElementById('overlay').click()
          } else if (action === 'quiet') {
            el.quiet.click()
          } else if (action === 'app') {
            location.href = './app/index.html'
          } else if (action === 'exit') {
            const appPlugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App
            if (appPlugin) void appPlugin.exitApp()
          }
        })
      })

      chatForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        const text = chatInput.value.trim()
        if (!text) return
        chatInput.value = ''
        appendChat('user', text)
        try {
          const res = await fetch(base + '/api/v1/messages', {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + token,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ conversationId: 'owner', text }),
          })
          if (!res.ok) {
            const body = await res.json().catch(() => ({}))
            appendChat('assistant', '发送失败：' + (body.error || res.status))
          }
        } catch (error) {
          appendChat('assistant', '发送失败：' + (error && error.message ? error.message : '网络错误'))
        }
      })

      el.wrap.addEventListener('pointerdown', () => {
        clearTimeout(pressTimer)
        pressTimer = setTimeout(() => {
          longPressed = true
          openSheet(menuSheet)
        }, 520)
      })
      el.wrap.addEventListener('pointerup', () => clearTimeout(pressTimer))
      el.wrap.addEventListener('pointercancel', () => clearTimeout(pressTimer))
      el.wrap.addEventListener('pointermove', (event) => {
        if (event.buttons === 0) return
      })
      el.wrap.addEventListener(
        'click',
        (event) => {
          if (!longPressed) return
          longPressed = false
          event.stopImmediatePropagation()
          event.preventDefault()
        },
        true,
      )
      window.openChatFromOverlay = () => openChat()

      setOnline(false)
      void latest()
      connect()
    </script>
  </body>
</html>
