<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src http: https:; img-src 'self' data: http: https:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>青梅</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" data-state="idle">
      <div id="drag-handle" title="按住拖动"></div>

      <div id="bubble" class="bubble" hidden role="status" aria-live="polite">
        <div class="bubble-head">
          <span id="bubble-kind" class="bubble-kind">青梅</span>
          <span id="bubble-count" class="bubble-count" hidden></span>
          <button id="bubble-close" class="bubble-close" type="button" aria-label="关闭气泡">×</button>
        </div>
        <p id="bubble-text" class="bubble-text"></p>
        <div class="bubble-tail"></div>
      </div>

      <section id="chat" class="chat" hidden aria-label="和青梅聊天">
        <div id="chat-log" class="chat-log"></div>
        <div id="chat-typing" class="chat-typing" hidden>青梅在想…</div>
        <form id="chat-form" class="chat-form">
          <input
            id="chat-input"
            class="chat-input"
            type="text"
            maxlength="2000"
            autocomplete="off"
            placeholder="跟青梅说点什么…"
            aria-label="消息"
          />
          <button id="chat-send" class="chat-send" type="submit">发送</button>
        </form>
      </section>

      <div id="pet-stage" class="pet-stage" tabindex="0" role="button" aria-label="青梅桌宠">
        <div id="pet-shadow" class="pet-shadow"></div>
        <video id="pet" class="pet" autoplay muted loop playsinline disablepictureinpicture aria-label="青梅桌宠"></video>
        <div id="pet-orb" class="pet pet-orb" hidden aria-label="小光球"><span class="orb-eye left"></span><span class="orb-eye right"></span><span class="orb-mouth"></span></div>
        <div id="zzz" class="zzz" aria-hidden="true">z z</div>
        <div id="hearts" class="hearts" aria-hidden="true"></div>
        <span id="status-dot" class="status-dot offline" title="未连接"></span>
      </div>

      <p id="hint" class="hint">点我摸摸 · 双击喂饭 · 右键菜单</p>
    </div>

    <div id="onboarding" class="onboarding" hidden>
      <div class="onboarding-card">
        <div class="onboarding-pet">🐟</div>
        <h1>青梅住到你桌面上</h1>
        <p>我会在右下角待着：服务器消息变成头顶气泡，点我摸摸，双击喂饭，右键聊天和设置。</p>
        <ul class="onboarding-list">
          <li>先填服务器地址和 QM_TOKEN</li>
          <li>透明区域点击穿透，不挡你做事</li>
          <li>设置里能调大小、音效和开机自启</li>
        </ul>
        <div class="onboarding-actions">
          <button id="onboarding-skip" type="button" class="ghost">稍后设置</button>
          <button id="onboarding-start" type="button" class="primary">开始连接</button>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="settings-modal" hidden>
      <form id="settings-form" class="settings-card">
        <h1>青梅桌面</h1>
        <p id="settings-welcome" class="settings-welcome">第一次使用：填服务器和令牌，点「测试连接」，再保存。</p>
        <label>
          服务器地址
          <input id="settings-server" type="url" placeholder="http://127.0.0.1:7410" required />
        </label>
        <label>
          访问令牌
          <input id="settings-token" type="password" placeholder="QM_TOKEN" autocomplete="off" />
        </label>
        <label>
          形象
          <select id="settings-character">
            <option value="qingmei">青梅</option>
            <option value="orb">小光球</option>
          </select>
        </label>
        <label class="settings-range">
          桌宠大小
          <input id="settings-scale" type="range" min="0.7" max="1.5" step="0.05" value="1" />
          <span id="settings-scale-value">100%</span>
        </label>
        <div class="settings-toggles">
          <label><input id="settings-sound" type="checkbox" checked /> 互动音效</label>
          <label><input id="settings-autostart" type="checkbox" /> 开机自启</label>
          <label><input id="settings-notify-hidden" type="checkbox" checked /> 隐藏时系统通知</label>`n          <label><input id="settings-hide-fullscreen" type="checkbox" /> 全屏时自动隐藏</label>
          <label><input id="settings-hide-fullscreen" type="checkbox" /> 全屏时自动隐藏</label>
        </div>
        <p id="settings-error" class="settings-error" hidden></p>
        <div class="settings-actions">
          <button id="settings-test" type="button" class="ghost">测试连接</button>
          <button id="settings-cancel" type="button" class="ghost">取消</button>
          <button id="settings-save" type="submit" class="primary">保存并连接</button>
        </div>
        <p class="settings-note">令牌只保存在本机；桌面端和 Web 用同一个 QM_TOKEN。</p>
      </form>
    </div>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
