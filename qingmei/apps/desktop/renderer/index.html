<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src http: https:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>青梅</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" data-state="idle">
      <div id="drag-handle" title="按住拖动"></div>

      <div id="bubble" class="bubble" hidden role="status" aria-live="polite">
        <div class="bubble-head">
          <span id="bubble-kind" class="bubble-kind">青梅</span>
          <span id="bubble-count" class="bubble-count" hidden></span>
          <button id="bubble-close" class="bubble-close" type="button" aria-label="关闭气泡">×</button>
        </div>
        <p id="bubble-text" class="bubble-text"></p>
        <div class="bubble-tail"></div>
      </div>

      <section id="chat" class="chat" hidden aria-label="和青梅聊天">
        <div id="chat-log" class="chat-log"></div>
        <div id="chat-typing" class="chat-typing" hidden>青梅在想…</div>
        <form id="chat-form" class="chat-form">
          <input
            id="chat-input"
            class="chat-input"
            type="text"
            maxlength="2000"
            autocomplete="off"
            placeholder="跟青梅说点什么…"
            aria-label="消息"
          />
          <button id="chat-send" class="chat-send" type="submit">发送</button>
        </form>
      </section>

      <div id="pet-stage" class="pet-stage">
        <div id="pet-shadow" class="pet-shadow"></div>
        <img id="pet" class="pet" alt="青梅桌宠" tabindex="0" role="button" draggable="false" />
        <button id="chat-button" class="chat-button" type="button" aria-label="聊天">💬</button>
        <button id="settings-button" class="settings-button" type="button" aria-label="设置">⚙</button>
        <div id="zzz" class="zzz" aria-hidden="true">z z</div>
        <div id="hearts" class="hearts" aria-hidden="true"></div>
        <span id="status-dot" class="status-dot offline" title="未连接"></span>
      </div>

      <p id="hint" class="hint">点我摸摸 · 双击喂饭 · 💬 聊天 · 拖哪停哪</p>
    </div>

    <div id="settings-modal" class="settings-modal" hidden>
      <form id="settings-form" class="settings-card">
        <h1>青梅桌面</h1>
        <label>
          服务器地址
          <input id="settings-server" type="url" placeholder="http://127.0.0.1:7410" required />
        </label>
        <label>
          访问令牌
          <input id="settings-token" type="password" placeholder="QM_TOKEN" autocomplete="off" />
        </label>
        <p id="settings-error" class="settings-error" hidden></p>
        <div class="settings-actions">
          <button id="settings-test" type="button" class="ghost">测试连接</button>
          <button id="settings-cancel" type="button" class="ghost">取消</button>
          <button id="settings-save" type="submit" class="primary">保存并连接</button>
        </div>
        <p class="settings-note">令牌只保存在本机；桌面端和 Web 用同一个 QM_TOKEN。</p>
      </form>
    </div>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
