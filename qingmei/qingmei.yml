# 青梅 P1 组合根（assembly root）
#
# 每一项是一份插件清单：name 是包名，组合根按 name 动态 import 后交给 cordis；
# config 原样传给插件。顺序无关：插件由依赖（inject）决定实际加载时机，
# 排在前面的消费方会停在 PENDING，等提供方就绪后自动继续。
#
# 相对路径（path / webRoot）以进程工作目录为基准，请在仓库根目录启动。

# ── 服务契约的实现（基础设施；service-store / service-llm 是门面，无运行时行为）
- name: '@qingmei/service-store'
- name: '@qingmei/service-llm'
- name: '@qingmei/service-channel'
- name: '@qingmei/service-gateway'

# 技能包（M6）：skills/*/SKILL.md + skill.json，热加载
- name: '@qingmei/qm-skill'
  config:
    skillsDir: ./skills
- name: '@qingmei/qm-skill/api'
- name: '@qingmei/service-memory'

# ── 提供方
- name: '@qingmei/provider-store-sqlite'
  config:
    path: './data/qm.db'

- name: '@qingmei/provider-memory-sqlite'
  config:
    limit: 5
    minConfidence: 0.6

- name: '@qingmei/provider-llm-echo'
  config:
    greeting: '我是青梅，P1 版本先跑通闭环。'

# 权限与审计：worker/ACP 的敏感动作仍走这里
- name: '@qingmei/provider-permission-static'

- name: '@qingmei/provider-audit-sqlite'

# 待人确认的审批队列：permission 判 ask、或子 agent 请求权限时落一条
- name: '@qingmei/provider-approval-sqlite'

# 任务账本：把任务派给 harness 并记录 run
- name: '@qingmei/provider-task-sqlite'

# 日程账本：at / everyMs / cron；qm-autonomy 与 qm-reminder 依赖它
- name: '@qingmei/provider-schedule-sqlite'
  config:
    tickMs: 1000
    defaultTimezone: 'Asia/Shanghai'

# ── 业务
- name: '@qingmei/service-persona'
  config:
    path: personas/qingmei.json

- name: '@qingmei/qm-agent'
  config:
    persona: '你叫青梅，是一个务实的个人助理。回答简短。'

# qm_message 的唯一写入方：qm-agent 只读历史，落库都走这里
- name: '@qingmei/qm-history'

# 日程到点投递：订阅 qm/schedule/due
- name: '@qingmei/qm-reminder'

# 把任务派给 harness；没有 harness 时 POST /api/v1/tasks 返回 503
- name: '@qingmei/qm-task'

# 审批队列的 HTTP 面：GET /api/v1/approvals、POST /api/v1/approvals/decide
- name: '@qingmei/qm-device'
  config: {}

- name: '@qingmei/qm-thread'

- name: '@qingmei/qm-approval'

# 内容层（账号运维 docs/18）：content_item / variant / action 账本 + 人审状态机
# 平台连接器未实现，connected 全 false；发布一律被闸门挡住，不会假装成功
- name: '@qingmei/qm-content'
  config:
    daily: { publish: 2, reply: 20, mention: 10 }
    quietStart: 23
    quietEnd: 8
    connected: { blog: false, weibo: false, bilibili: false, zhihu: false }

# 审计的只读查询面：GET /api/v1/audit
- name: '@qingmei/qm-audit'

# 自主循环（A1 建议模式）：每 5 分钟巡一次，值得打扰时给一条建议
- name: '@qingmei/qm-autonomy'
  config:
    dailyBudget: 3
    quietStart: 23
    quietEnd: 8

# 夜间巩固：每天 4 点压缩同主题低价值事实（POST /api/v1/memory/consolidate 可手动触发）
- name: '@qingmei/qm-consolidate'
  config:
    hour: 4

# 群画像：未配置的群回「权限未配置」，打标签后按策略回复
- name: '@qingmei/qm-conversation-profile'

# 身份绑定：每渠道第一个私聊自动绑 owner，之后陌生账号需显式 bind
- name: '@qingmei/qm-identity'

# 自愈：失败回合/任务 → incident 指纹去重、提案、熔断、派诊断
- name: '@qingmei/qm-incident'

# 月度复盘：每月 1 号生成报告，支持打分与低分提醒
- name: '@qingmei/qm-review'

# 记忆热点（A4）：夜间小步调整 + 周报；可回滚、有审计
- name: '@qingmei/qm-memory-hotspot'

# 主动开场（A6/A7/A8）：窗口 + 理由 + 承诺 + 措辞/时机学习
- name: '@qingmei/qm-opener'

# 任务督促（W1/W2）：合同 + 进度阶梯（L1/L2 通知，L3/L4 只记录）
- name: '@qingmei/qm-nudge'

# 休息侧（W5）：90 分钟提醒、23:30 收工、连续 6 天降强度
- name: '@qingmei/qm-rest'

# ── 渠道与宿主
- name: '@qingmei/channel-web'

# 飞书渠道：配置 appId/appSecret（或 QM_FEISHU_APP_ID / QM_FEISHU_APP_SECRET）才启用
- name: '@qingmei/channel-feishu'

# QQ 机器人渠道：配置 appId/clientSecret（或 QM_QQ_APP_ID / QM_QQ_CLIENT_SECRET）才启用
- name: '@qingmei/channel-qq'

- name: '@qingmei/host-gateway'
  config:
    host: '127.0.0.1'
    port: 7410
    token: 'dev-token'
    webRoot: './apps/web/dist'
