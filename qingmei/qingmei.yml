# 青梅 P1 组合根（assembly root）
#
# 每一项是一份插件清单：name 是包名，组合根按 name 动态 import 后交给 cordis；
# config 原样传给插件。顺序无关：插件由依赖（inject）决定实际加载时机，
# 排在前面的消费方会停在 PENDING，等提供方就绪后自动继续。
#
# 相对路径（path / webRoot）以进程工作目录为基准，请在仓库根目录启动。

# ── 服务契约的实现（基础设施；service-store / service-llm 是门面，无运行时行为）
- name: '@qingmei/service-store'
- name: '@qingmei/service-llm'
- name: '@qingmei/service-channel'
- name: '@qingmei/service-gateway'

# ── 提供方
- name: '@qingmei/provider-store-sqlite'
  config:
    path: './data/qm.db'

- name: '@qingmei/provider-llm-echo'
  config:
    greeting: '我是青梅，P1 版本先跑通闭环。'

# 权限与审计：工具调用的准入与留痕（host-mcp 依赖它们）
- name: '@qingmei/provider-permission-static'

- name: '@qingmei/provider-audit-sqlite'

# 待人确认的审批队列：permission 判 ask、或子 agent 请求权限时落一条
- name: '@qingmei/provider-approval-sqlite'

# 任务账本：把任务派给 harness 并记录 run（host-mcp 的任务工具依赖它）
- name: '@qingmei/provider-task-sqlite'

# ── 业务
- name: '@qingmei/qm-agent'
  config:
    persona: '你叫青梅，是一个务实的个人助理。回答简短。'

# qm_message 的唯一写入方：qm-agent 只读历史，落库都走这里
- name: '@qingmei/qm-history'

# 把任务派给 harness；没有 harness 时 POST /api/v1/tasks 返回 503
- name: '@qingmei/qm-task'

# 审批队列的 HTTP 面：GET /api/v1/approvals、POST /api/v1/approvals/decide
- name: '@qingmei/qm-approval'

# ── 渠道与宿主
- name: '@qingmei/channel-web'

- name: '@qingmei/host-gateway'
  config:
    host: '127.0.0.1'
    port: 7410
    token: 'dev-token'
    webRoot: './apps/web/public'
