# 青梅 P1 组合根（assembly root）
#
# 每一项是一份插件清单：name 是包名，组合根按 name 动态 import 后交给 cordis；
# config 原样传给插件。顺序无关：插件由依赖（inject）决定实际加载时机，
# 排在前面的消费方会停在 PENDING，等提供方就绪后自动继续。
#
# 相对路径（path / webRoot）以进程工作目录为基准，请在仓库根目录启动。

# ── 运行时服务（契约在 core；store/llm/memory 不再单独装门面包）
- name: '@qingmei/service-channel'
- name: '@qingmei/service-gateway'

# 技能包（M6）：skills/*/SKILL.md + skill.json，热加载
- name: '@qingmei/qm-skill'
  config:
    skillsDir: ./skills

# ── 提供方
- name: '@qingmei/provider-store-sqlite'
  config:
    path: './data/qm.db'

- name: '@qingmei/provider-neuron-memory'
  config:
    limit: 5
    minConfidence: 0.6
    autoApplyConcepts: true

# 仅本地开发/测试：生产默认不装配任何 LLM
- name: '@qingmei/provider-llm-echo'
  config:
    greeting: '我是青梅，P1 版本先跑通闭环。'

# 权限与审计：worker/ACP 的敏感动作仍走这里


# 待人确认的审批队列：permission 判 ask、或子 agent 请求权限时落一条

# 任务账本：把任务派给 harness 并记录 run

# 日程已并入任务：qm-task 内置调度器扫描 scheduled 任务

# ── 业务
- name: '@qingmei/service-persona'
  config:
    path: personas/qingmei.json

# 画像：青梅自己 / 主人 / 群（人格、偏好、群规则都从这里来）
- name: '@qingmei/qm-portrait'
  config:
    persona: '你叫青梅，是一个务实的个人助理。回答简短。'
- name: '@qingmei/qm-psyche'
  config:
    moodHalfLifeHours: 6
- name: '@qingmei/qm-agent'
  config:
    persona: '你叫青梅，是一个务实的个人助理。回答简短。'

# qm_message 的唯一写入方：qm-agent 只读历史，落库都走这里
- name: '@qingmei/qm-history'

# 日程到点投递：订阅 qm/schedule/due

# 自治循环：只产生建议，先观察再提案
- name: '@qingmei/qm-autonomy'
  config:
    tickMs: 300000
    dailyBudget: 0
    quietStart: 23
    quietEnd: 8
    # 主动模块：开场、督促、休息、故障提案、群策略（测试环境可全开）
    modules: true
    reflection: true
    reflectionHour: 9

# 自我进化：成功任务 → 技能草稿，人审后 install（技能自带版本备份与回滚）
- name: '@qingmei/qm-evolve'
  config:
    maxDrafts: 20
# 可选语义向量：智谱 embedding-3（OpenAI 兼容）；没配 QM_EMBEDDING_URL 时自动不注册
- name: '@qingmei/provider-embedding-http'
  config:
    url: '${QM_EMBEDDING_URL}'
    apiKey: '${QM_EMBEDDING_KEY}'
    model: embedding-3
# 成本观测：读 DeepSeek 余额（只读），记录每日快照；没有 key 时静默
- name: '@qingmei/qm-cost'
  config: {}
# 把任务派给 harness；没有 harness 时 POST /api/v1/tasks 返回 503
- name: '@qingmei/qm-task'

# 审批队列的 HTTP 面：GET /api/v1/approvals、POST /api/v1/approvals/decide
- name: '@qingmei/qm-device'
  config: {}


- name: '@qingmei/qm-approval'

# 身份绑定：每渠道第一个私聊自动绑 owner，之后陌生账号需显式 bind
- name: '@qingmei/qm-identity'

# 会话凝练：回合结束后按规则抽「候选事实」，主人在记忆页采纳才写入
- name: '@qingmei/qm-distill'
  config:
    maxPending: 200
    # 模型补抽默认关闭；打开前先确认 LLM 已配置，并按天限流
    llmExtract: false
    llmDailyLimit: 20

- name: '@qingmei/channel-web'

# 月度复盘：每月 1 号出报告，可在「复盘」页评分、采纳 prompt 提案
- name: '@qingmei/qm-review'
  config:
    dayOfMonth: 1
    hour: 9
# 飞书渠道：配置 appId/appSecret（或 QM_FEISHU_APP_ID / QM_FEISHU_APP_SECRET）才启用
- name: '@qingmei/channel-feishu'

# QQ 机器人渠道：配置 appId/clientSecret（或 QM_QQ_APP_ID / QM_QQ_CLIENT_SECRET）才启用
- name: '@qingmei/channel-qq'

# 自规划循环：默认关，避免本地开发时反复调模型

- name: '@qingmei/host-gateway'
  config:
    host: '127.0.0.1'
    port: 7410
    token: 'dev-token'
    webRoot: './apps/web/dist'











